name: erp-readiness20
services:
  db:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: odoo
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db:/var/lib/postgresql/data
    networks: [uat]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U odoo -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    restart: unless-stopped
  app:
    image: odoo@sha256:dc76c42d292af9c513de826620e5a5dbe8152383ce8767eb6ed1390a806eb32f
    entrypoint: [python3, /mnt/erp/ops/readiness/entrypoint.py]
    command: [-d, '${ERP_DATABASE:-erp_readiness}', --db-filter, '^${ERP_DATABASE:-erp_readiness}$$']
    environment:
      ERP_WORKERS: ${ERP_WORKERS:-2}
      ERP_CRON_THREADS: ${ERP_CRON_THREADS:-0}
    secrets: [db_password, admin_password, uat_password]
    volumes:
      - ${ERP_ROOT:?Set canonical workspace root}:/mnt/erp:ro
      - filestore:/var/lib/odoo
    networks: [uat]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: ${ERP_HEALTHCHECK_DISABLED:-false}
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8069/web/health", timeout=5).read()']
      interval: 15s
      timeout: 6s
      retries: 10
    mem_limit: 4g
    shm_size: 256m
    restart: unless-stopped
  proxy:
    image: caddy@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    volumes:
      - ${ERP_ROOT:?Set canonical workspace root}/ops/readiness/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:18069:8080'
    networks: [uat]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/data, /config, /tmp]
    mem_limit: 128m
    restart: unless-stopped
networks:
  uat:
    ipam:
      config:
        - subnet: 10.251.44.0/24
volumes:
  db:
  filestore:
    external: true
    name: erp-readiness20_filestore
secrets:
  db_password:
    file: ${ERP_SECRETS_DIR:?Set external secrets directory}/db_password
  admin_password:
    file: ${ERP_SECRETS_DIR:?Set external secrets directory}/admin_password
  uat_password:
    file: ${ERP_SECRETS_DIR:?Set external secrets directory}/uat_password
