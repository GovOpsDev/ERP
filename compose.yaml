name: govopsdev-erp-quick
services:
  prepare:
    image: ${ERP_IMAGE:-govopsdev/govopsdev-erp:v20.0}
    user: '0:0'
    entrypoint: [python3, /setup/bootstrap.py]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - secrets:/run/generated-secrets
      - postgres_admin_secret:/run/generated-postgres-admin
      - database:/existing-db:ro
      - ./docker/bootstrap.py:/setup/bootstrap.py:ro
    restart: 'no'
  db:
    image: ${ERP_POSTGRES_IMAGE:-govopsdev-erp-postgres:16-20261108-hardened1}
    build:
      context: .
      dockerfile: docker/Postgres.Dockerfile
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/postgres-admin/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      ERP_DATABASE: ${ERP_DATABASE:-govopsdev_erp}
    volumes:
      - secrets:/run/secrets:ro
      - postgres_admin_secret:/run/postgres-admin:ro
      - database:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-erp.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70
    networks: [database]
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    restart: unless-stopped
  initialize:
    image: ${ERP_IMAGE:-govopsdev/govopsdev-erp:v20.0}
    entrypoint: [python3, /setup/initialize.py]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      HOST: db
      USER: odoo
      ERP_DATABASE: ${ERP_DATABASE:-govopsdev_erp}
      PASSWORD_FILE: /run/secrets/db_password
      ODOO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ERP_WORKERS: '0'
      ERP_CRON_THREADS: '0'
    volumes:
      - secrets:/run/secrets:ro
      - filestore:/var/lib/odoo
      - ./docker/initialize.py:/setup/initialize.py:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    networks: [database, frontend]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  erp:
    image: ${ERP_IMAGE:-govopsdev/govopsdev-erp:v20.0}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      HOST: db
      USER: odoo
      ERP_DATABASE: ${ERP_DATABASE:-govopsdev_erp}
      PASSWORD_FILE: /run/secrets/db_password
      ODOO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ERP_WORKERS: ${ERP_WORKERS:-0}
      ERP_CRON_THREADS: ${ERP_CRON_THREADS:-0}
    ports: ['127.0.0.1:${ERP_HTTP_PORT:-18071}:8069']
    volumes:
      - filestore:/var/lib/odoo
      - secrets:/run/secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    networks: [database, frontend]
    depends_on:
      db:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8069/web/health", timeout=5).read()']
      interval: 15s
      timeout: 6s
      retries: 10
    logging: *logging
    restart: unless-stopped
networks:
  database:
    internal: true
  frontend:
volumes:
  database:
  filestore:
  secrets:
  postgres_admin_secret:
